name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and pack
        run: |
          npm test
          npm run pack
      - name: Tag must match manifest version
        run: |
          node --input-type=module <<'EOF'
          import { readManifestVersion } from "./scripts/readme-version.mjs";
          const version = readManifestVersion();
          const tag = process.env.GITHUB_REF_NAME.slice(1);
          if (tag !== version) {
            console.error(`Tag v${tag} does not match manifest ${version}`);
            process.exit(1);
          }
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/other-goats-records-*.zip \
            --title "Other Goats Records ${GITHUB_REF_NAME#v}" \
            --generate-notes
      - name: Point README at this release
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          node scripts/readme-version.mjs --version "${GITHUB_REF_NAME#v}"
          if git diff --quiet README.md; then
            echo "README already matches ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Point README install links at ${GITHUB_REF_NAME#v}."
          git push origin main
