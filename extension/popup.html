<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Other Goats Records</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Other Goats Records</h1>
      <p id="status">Loading…</p>
      <nav class="tabs" role="tablist" aria-label="Captured data">
        <button
          type="button"
          role="tab"
          id="tab-animals"
          data-tab="animals"
          aria-selected="true"
          aria-controls="panel"
        >
          Animals
        </button>
        <button
          type="button"
          role="tab"
          id="tab-linear"
          data-tab="linear"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          LA
        </button>
        <button
          type="button"
          role="tab"
          id="tab-pti"
          data-tab="pti"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          PTI
        </button>
      </nav>
    </header>
    <main id="panel" role="tabpanel" aria-labelledby="tab-animals">
      <ul id="list"></ul>
      <p id="empty" hidden>
        Visit goat detail pages on genetics.adga.org. Captured animals appear
        here. Opening Pedigree, Progeny, or Linear History on the same page
        adds more rows.
      </p>
    </main>
    <footer>
      <button type="button" id="download" disabled>Download zip</button>
      <button type="button" id="clear" disabled>Clear queue</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
