<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Other Goats Records</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="masthead">
        <h1>Other Goats Records</h1>
      </div>
      <p id="version"></p>
      <p id="status" hidden></p>
      <nav class="tabs" role="tablist" aria-label="Captured data">
        <button
          type="button"
          role="tab"
          id="tab-animals"
          data-tab="animals"
          aria-selected="true"
          aria-controls="panel"
        >
          Animals
        </button>
        <button
          type="button"
          role="tab"
          id="tab-linear"
          data-tab="linear"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          LA
        </button>
        <button
          type="button"
          role="tab"
          id="tab-pti"
          data-tab="pti"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          PTI
        </button>
        <button
          type="button"
          role="tab"
          id="tab-settings"
          class="tab-icon"
          data-tab="settings"
          aria-label="Settings"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle
              cx="12"
              cy="12"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
        </button>
      </nav>
      <div id="search-bar" class="search-bar">
        <input
          type="search"
          id="search"
          placeholder="Search name or registration"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="search-clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              d="M4 4l8 8M12 4l-8 8"
            />
          </svg>
        </button>
      </div>
    </header>
    <main id="panel" role="tabpanel" aria-labelledby="tab-animals">
      <ul id="list"></ul>
      <p id="empty" hidden>
        Visit goat detail pages on genetics.adga.org. Captured animals appear
        here. Opening Pedigree, Progeny, or Linear History on the same page
        adds more rows.
      </p>
      <form id="settings" hidden>
        <label>
          <input type="checkbox" id="opt-individuals" checked />
          <span>Record individuals</span>
        </label>
        <label class="sub">
          <input type="checkbox" id="opt-ancestry" checked />
          <span>
            Record ancestors
            <span class="hint"
              >When off, sire and dam still save on the animal you open.</span
            >
          </span>
        </label>
        <label>
          <input type="checkbox" id="opt-pti" checked />
          <span>Record PTI scores</span>
        </label>
        <label>
          <input type="checkbox" id="opt-linear" checked />
          <span>Record Linear History</span>
        </label>
      </form>
    </main>
    <footer>
      <button type="button" id="download-csv" disabled>Download CSV</button>
      <button type="button" id="download" disabled>Download zip</button>
      <button type="button" id="clear" disabled>Clear</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
