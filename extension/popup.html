<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Other Goats Records</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Other Goats Records</h1>
      <p id="status">Loading…</p>
      <nav class="tabs" role="tablist" aria-label="Captured data">
        <button
          type="button"
          role="tab"
          id="tab-animals"
          data-tab="animals"
          aria-selected="true"
          aria-controls="panel"
        >
          Animals
        </button>
        <button
          type="button"
          role="tab"
          id="tab-linear"
          data-tab="linear"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          LA
        </button>
        <button
          type="button"
          role="tab"
          id="tab-pti"
          data-tab="pti"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          PTI
        </button>
        <button
          type="button"
          role="tab"
          id="tab-settings"
          data-tab="settings"
          aria-selected="false"
          aria-controls="panel"
          tabindex="-1"
        >
          Settings
        </button>
      </nav>
    </header>
    <main id="panel" role="tabpanel" aria-labelledby="tab-animals">
      <ul id="list"></ul>
      <p id="empty" hidden>
        Visit goat detail pages on genetics.adga.org. Captured animals appear
        here. Opening Pedigree, Progeny, or Linear History on the same page
        adds more rows.
      </p>
      <form id="settings" hidden>
        <label>
          <input type="checkbox" id="opt-ancestry" />
          <span>
            Capture ancestry as individuals
            <span class="hint"
              >When off, sire and dam still save on the animal you open.
              Ancestors do not get their own rows.</span
            >
          </span>
        </label>
        <label>
          <input type="checkbox" id="opt-pti" />
          <span>Record PTI scores</span>
        </label>
        <label>
          <input type="checkbox" id="opt-linear" />
          <span>Record Linear History</span>
        </label>
      </form>
    </main>
    <footer>
      <button type="button" id="download-csv" disabled>Download CSV</button>
      <button type="button" id="download" disabled>Download zip</button>
      <button type="button" id="clear" disabled>Clear queue</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
